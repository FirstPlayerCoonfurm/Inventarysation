version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
      # Попробуйте также другие порты:
      # - "8080:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=it_inventory
      - DB_USER=it_user
      - DB_PASSWORD=secure_password
      - SECRET_KEY=your-production-secret-key-change-this
      - PYTHONUNBUFFERED=1
      # Добавляем для диагностики
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/home/app/logs
      # Монтируем код для live-обновления
      - .:/app
    restart: unless-stopped
    networks:
      - app-network
    cap_add:
      - NET_ADMIN
      - NET_RAW
    # Простая команда без сложного sh
    command: python app.py
    # Добавляем healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=it_inventory
      - POSTGRES_USER=it_user
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    # Не открываем порт БД наружу для безопасности
    # ports:
    #   - "5432:5432"
    expose:
      - "5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_user -d it_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
