version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=it_inventory
      - DB_USER=it_user
      - DB_PASSWORD=secure_password
      - SECRET_KEY=your-production-secret-key-change-this
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/home/app/logs
    restart: unless-stopped
    networks:
      - app-network
    command: >
      sh -c "
        echo '🔄 Инициализация базы данных...' &&
        sleep 10 &&
        python -c '
        import sys
        sys.path.append(\"/app\")
        from app import app
        from models import db
        with app.app_context():
        db.create_all()
        print(\"✅ База данных инициализирована\")
        ' &&
        echo '🚀 Запуск приложения...' &&
        python app.py
      "

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=it_inventory
      - POSTGRES_USER=it_user
      - POSTGRES_PASSWORD=secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U it_user -d it_inventory"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge